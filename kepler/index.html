<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kepler Plan</title>
    <link rel="stylesheet" href="./styles.css" />
    <meta name="theme-color" content="#1f75ff" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">Kepler <span>Plan</span><small>концепт-планировщик домов</small></div>
        <div class="mode-tabs" role="tablist">
          <button id="modePlanBtn" class="tab active" role="tab">План</button>
          <button id="modeSiteBtn" class="tab" role="tab">Участок</button>
        </div>
        <input id="projectName" class="project-name" value="Новый дом" aria-label="Название проекта" />
        <div class="top-actions">
          <button id="undoBtn" class="icon-btn" title="Отменить (Ctrl+Z)">⟲</button>
          <button id="redoBtn" class="icon-btn" title="Повторить (Ctrl+Shift+Z)">⟳</button>
          <button id="fitBtn" title="Вписать план в экран">Вписать</button>
          <button id="themeBtn" class="icon-btn" title="Светлая / тёмная тема">☀</button>
          <button id="menuBtn" title="Главное меню: новый проект, открыть, пример">☰ Меню</button>
          <input type="file" id="fileInput" accept=".json,application/json" hidden />
          <button id="saveBtn" class="primary" title="Скачать файл проекта">Сохранить</button>
          <div class="export-wrap">
            <button id="exportBtn" class="primary">Экспорт ▾</button>
            <div class="export-dropdown" id="exportDropdown" hidden>
              <button data-export="json">Структурированный JSON (для Revit-плагина)</button>
              <button data-export="dxf">DXF-чертёж</button>
              <button data-export="dxf-revit">DXF со слоями для Revit</button>
              <button data-export="copy">Копировать проект в буфер</button>
            </div>
          </div>
        </div>
      </header>

      <div class="status-strip" id="connectivityBar" hidden></div>

      <main class="workspace">
        <aside class="library">
          <h2 id="libraryTitle">Помещения</h2>
          <p class="hint" id="libraryHint">Кликните тип, затем место на плане. Комнаты стыкуются сами.</p>
          <div class="room-cards" id="roomCards"></div>
          <div class="room-cards" id="siteTools" hidden></div>
          <input type="file" id="underlayInput" accept=".jpg,.jpeg,.png,.pdf,.dwg,.dxf,image/jpeg,image/png,application/pdf" hidden />
        </aside>

        <section class="canvas-wrap">
          <canvas id="canvas"></canvas>
          <div class="canvas-hint" id="canvasHint" hidden></div>
          <div class="cal-overlay" id="calOverlay" hidden>
            <span class="cal-label">Длина отрезка:</span>
            <input id="calInput" type="number" step="0.1" min="0.1" inputmode="decimal" placeholder="0.0" />
            <span class="cal-unit">м</span>
          </div>
          <div class="zoom-controls">
            <button id="zoomInBtn" title="Приблизить">+</button>
            <button id="zoomOutBtn" title="Отдалить">−</button>
          </div>
          <div class="statusbar">
            <span id="cursorPos"></span>
            <span id="scaleInfo"></span>
          </div>
        </section>

        <aside class="props" id="propsPanel"></aside>
      </main>
    </div>

    <div id="toast" role="status"></div>

    <div class="start-screen" id="startScreen" hidden>
      <div class="start-card">
        <div class="start-head">
          <div class="brand">Kepler <span>Plan</span><small>концепт-планировщик домов</small></div>
          <button class="icon-btn" id="startClose" title="Закрыть" hidden>✕</button>
        </div>
        <div id="startWarn" class="start-warn" hidden></div>
        <div class="start-actions">
          <button class="start-item" id="startContinue" hidden>
            <b>Продолжить</b><span>вернуться к текущему проекту</span></button>
          <button class="start-item accent" id="startNew">
            <b>＋ Новый проект</b><span>чистый лист без топосъёмки и мебели</span></button>
          <button class="start-item" id="startOpen">
            <b>Открыть файл…</b><span>.kepler.json с компьютера</span></button>
          <button class="start-item" id="startSample">
            <b>Загрузить пример</b><span>демо-дом с участком и инсоляцией</span></button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
