name: Zamer CAD

on:
  push:
    branches: [main]
    paths: ['prototype/**', 'android-offline/**', 'shared/cad/**', '.github/workflows/zamer.yml']
  pull_request:
    paths: ['prototype/**', 'android-offline/**', 'shared/cad/**', '.github/workflows/zamer.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: prototype
      - run: npm run check:encoding
        working-directory: prototype
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash ./gradlew assembleDebug lintDebug
        working-directory: android-offline
