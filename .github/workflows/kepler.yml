name: Kepler Plan

on:
  push:
    branches: [main]
    paths: ['kepler/**', 'shared/cad/**', 'firestore.rules', 'firebase.review-test.json', '.github/workflows/kepler.yml']
  pull_request:
    paths: ['kepler/**', 'shared/cad/**', 'firestore.rules', 'firebase.review-test.json', '.github/workflows/kepler.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kepler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kepler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kepler/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Юнит-тесты ядра
        # The wall performance test needs to avoid CPU contention with other test files.
        run: node --test --test-concurrency=1 tests/*.test.mjs

  e2e:
    # 110 файлов e2e идут последовательно ~40–60 мин — делим на части.
    name: e2e ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: kepler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kepler/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Chromium для e2e
        run: npx playwright install --with-deps chromium

      - name: e2e (Playwright)
        run: >-
          node --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/4
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./scripts/test-github-reporter.mjs --test-reporter-destination=stdout
          tests/e2e/*.e2e.mjs

  revit:
    name: Revit API ${{ matrix.version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: [2025, 2026]
    defaults:
      run:
        working-directory: kepler/revit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Сборка надстройки
        run: dotnet build -c Release -p:RevitVersion=${{ matrix.version }}
      - name: Установочные файлы для приёмки в Revit
        uses: actions/upload-artifact@v4
        with:
          name: Kepler-Revit-${{ matrix.version }}
          if-no-files-found: error
          path: |
            kepler/revit/bin/Release/net8.0-windows/KeplerRevit.dll
            kepler/revit/KeplerImport.addin
            kepler/revit/README.md

  review-rules:
    name: Firestore review permissions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kepler
    env:
      KEPLER_FIREBASE_TEST_ROOT: /tmp/kepler-review-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Зависимости интеграционного теста
        run: npm install --prefix "$KEPLER_FIREBASE_TEST_ROOT" firebase-tools@15.37.0 @firebase/rules-unit-testing@6.0.0 firebase@13.4.0
      - name: Изоляция снимков, неизменяемость, ответы и отзыв
        run: >-
          "$KEPLER_FIREBASE_TEST_ROOT/node_modules/.bin/firebase" emulators:exec
          --project demo-kepler-concept --only firestore --config ../firebase.review-test.json
          "node --test tests/integration/review-sharing.emulator.mjs"
