name: Kepler Plan — GitHub Pages

on:
  push:
    branches: [claude/awesome-gates-znrtlm]
    paths:
      - 'kepler/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Публикация сайта
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получение репозитория
        uses: actions/checkout@v4

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5

      - name: Подготовка сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: kepler

      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
