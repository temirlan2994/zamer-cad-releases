name: Kepler Plan — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'kepler/**'
      - '!kepler/tests/**'
      - 'shared/cad/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка сайта
    runs-on: ubuntu-latest
    steps:
      - name: Получение репозитория
        uses: actions/checkout@v5

      - name: Новая версия для каждой публикации
        run: >-
          node kepler/scripts/release-version.mjs check-live
          "https://temirlan2994.github.io/zamer-cad-releases/package.json?candidate=${{ github.sha }}"

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5

      - name: Версия и офлайн-файлы PWA
        run: node kepler/scripts/build-pages.mjs "$GITHUB_SHA"

      - name: Подготовка сайта
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/kepler-pages

  deploy:
    name: Публикация сайта
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - name: Публикация
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Пауза после ошибки GitHub Pages
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - name: Повтор публикации
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Пауза перед последней попыткой
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 30
      - name: Последняя попытка публикации
        if: steps.deployment_retry.outcome == 'failure'
        id: deployment_final
        uses: actions/deploy-pages@v5
