name: Kepler Plan — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'kepler/**'
      - '!kepler/tests/**'
      - 'shared/cad/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Публикация сайта
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получение репозитория
        uses: actions/checkout@v5

      - name: Новая версия для каждой публикации
        run: >-
          node kepler/scripts/release-version.mjs check-live
          "https://temirlan2994.github.io/zamer-cad-releases/package.json?candidate=${{ github.sha }}"

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5

      - name: Версия и офлайн-файлы PWA
        run: node kepler/scripts/build-pages.mjs "$GITHUB_SHA"

      - name: Подготовка сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/kepler-pages

      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
