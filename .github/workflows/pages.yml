name: Kepler Plan — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'kepler/**'
      - 'shared/cad/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Публикация сайта
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получение репозитория
        uses: actions/checkout@v5

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5

      - name: Версия и офлайн-файлы PWA
        run: node kepler/scripts/build-pages.mjs "$GITHUB_SHA"

      - name: Подготовка сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/kepler-pages

      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
