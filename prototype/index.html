<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content" />
    <title>Zamer CAD Prototype</title>
    <link rel="stylesheet" href="./styles.css?v=30" />
  </head>
  <body>
    <main class="app-shell" data-theme="light">
      <header class="topbar">
        <div class="project-title">
          <strong>Замер квартиры</strong>
          <span>ММ • 1:50</span>
        </div>
        <button class="icon-button" id="undoButton" title="Отмена" aria-label="Отмена">↶</button>
        <button class="icon-button" id="redoButton" title="Повтор" aria-label="Повтор">↷</button>
        <button class="icon-button" id="layersButton" title="Слои" aria-label="Слои">▤</button>
        <button class="icon-button" id="themeButton" title="Тема" aria-label="Тема">☾</button>
        <button class="icon-button primary" id="exportButton" title="Экспорт" aria-label="Экспорт">⇩</button>
      </header>

      <section class="snap-panel" aria-label="Привязки черчения">
        <div class="snap-row" aria-label="Привязки">
          <button class="snap active" data-snap="grid">Сетка</button>
          <button class="snap active" data-snap="end">Конец</button>
          <button class="snap" data-snap="mid">Середина</button>
          <button class="snap icon-snap active" data-snap="polar" title="Привязка к траектории 0/45/90°" aria-label="Привязка к траектории">↗</button>
        </div>
      </section>

      <section class="workspace">
        <nav class="tool-rail" aria-label="Инструменты">
          <button class="tool active" data-tool="select"><span>↖</span><small>Выбор</small></button>
          <button class="tool" data-tool="line"><span>╱</span><small>Линия</small></button>
          <button class="tool" data-tool="wall"><span>▌</span><small>Стена</small></button>
          <button class="tool" data-tool="dimension"><span>↔</span><small>Размер</small></button>
          <button class="tool" data-tool="furniture"><span>□</span><small>Мебель</small></button>
        </nav>

        <canvas id="cadCanvas" aria-label="Чертежный холст"></canvas>
        <div class="center-cursor" aria-hidden="true">
          <span class="cursor-line horizontal"></span>
          <span class="cursor-line vertical"></span>
          <span class="cursor-ring"></span>
        </div>

        <div class="status-chip" id="statusChip">Выберите Линия и тяните отрезок</div>
        <div class="draw-metrics" id="drawMetrics" hidden>
          <label>
            <span>L</span>
            <input id="topLengthInput" inputmode="decimal" value="3240" aria-label="Длина" />
            <em>мм</em>
          </label>
          <label>
            <span>°</span>
            <input id="topAngleInput" inputmode="decimal" value="90" aria-label="Угол" />
          </label>
        </div>
        <div class="inline-editors" id="inlineEditors" hidden>
          <label class="inline-editor length-editor" id="lengthEditor">
            <input id="lengthInput" inputmode="decimal" value="3240" aria-label="Длина линии" />
            <span>мм</span>
          </label>
          <label class="inline-editor angle-editor" id="angleEditor">
            <input id="angleInput" inputmode="decimal" value="90" aria-label="Угол линии" />
            <span>°</span>
          </label>
        </div>
        <div class="selection-actions" id="selectionActions" hidden>
          <button data-action="move">↕<span>Переместить</span></button>
          <button data-action="copy">⧉<span>Копия</span></button>
          <button data-action="rotate">↻<span>Поворот</span></button>
          <button data-action="mirror">⇆<span>Зеркало</span></button>
          <button data-action="offset">∥<span>Смещение</span></button>
          <button data-action="delete">⌫<span>Удалить</span></button>
        </div>
      </section>

      <section class="furniture-sheet" id="furnitureSheet" hidden data-position="half" aria-label="Библиотека мебели">
        <div class="sheet-handle" role="button" tabindex="0"></div>
        <div class="furniture-tabs" aria-label="Категории библиотеки">
          <button class="furniture-tab active" data-tab="furniture">Мебель</button>
          <button class="furniture-tab" data-tab="doors">Двери</button>
          <button class="furniture-tab" data-tab="windows">Окна</button>
          <button class="furniture-tab" data-tab="kitchen">Кухня</button>
          <button class="furniture-tab" data-tab="bath">Санузел</button>
          <button class="furniture-tab" data-tab="decor">Декор</button>
        </div>
        <div class="furniture-browser">
          <nav class="furniture-cats" aria-label="Тип мебели">
            <button class="active" data-category="sofas">Диваны</button>
            <button data-category="beds">Кровати</button>
            <button data-category="tables">Столы</button>
            <button data-category="chairs">Стулья</button>
            <button data-category="storage">Шкафы</button>
            <button data-category="cabinets">Тумбы</button>
          </nav>
          <div class="furniture-grid">
            <button class="block furniture-card active" data-tab="furniture" data-category="sofas" data-block="sofa" data-w="2200" data-h="950">
              <span class="furniture-thumb svg-thumb sofa-thumb">
                <img src="./assets/floor-symbols/CouchLeft.svg" alt="" />
                <img src="./assets/floor-symbols/CouchMiddle.svg" alt="" />
                <img src="./assets/floor-symbols/CouchRight.svg" alt="" />
              </span>
              <strong>Диван 3 места</strong>
              <small>2200 × 950</small>
              <b>✓</b>
            </button>
            <button class="block furniture-card" data-tab="furniture" data-category="sofas" data-block="sofa" data-w="2000" data-h="900">
              <span class="furniture-thumb svg-thumb sofa-thumb compact">
                <img src="./assets/floor-symbols/CouchLeft.svg" alt="" />
                <img src="./assets/floor-symbols/CouchRight.svg" alt="" />
              </span>
              <strong>Диван прямой</strong>
              <small>2000 × 900</small>
              <b>✓</b>
            </button>
            <button class="block furniture-card" data-tab="furniture" data-category="sofas" data-block="sectional" data-w="2600" data-h="1600">
              <span class="furniture-thumb svg-thumb sectional-thumb">
                <img src="./assets/floor-symbols/CouchLeft.svg" alt="" />
                <img src="./assets/floor-symbols/CouchMiddle.svg" alt="" />
                <img src="./assets/floor-symbols/CouchRight.svg" alt="" />
                <img src="./assets/floor-symbols/LoungeChair.svg" alt="" />
              </span>
              <strong>Угловой диван</strong>
              <small>2600 × 1600</small>
              <b>✓</b>
            </button>
            <button class="block furniture-card" data-tab="furniture" data-category="beds" data-block="bed" data-w="1800" data-h="2000">
              <span class="furniture-thumb svg-thumb single-symbol"><img src="./assets/floor-symbols/QueenBed.svg" alt="" /></span>
              <strong>Кровать</strong>
              <small>1800 × 2000</small>
              <b>✓</b>
            </button>
            <button class="block furniture-card" data-tab="furniture" data-category="tables" data-block="table" data-w="1400" data-h="800">
              <span class="furniture-thumb svg-thumb single-symbol"><img src="./assets/floor-symbols/Table.svg" alt="" /></span>
              <strong>Обеденный стол</strong>
              <small>1400 × 800</small>
              <b>✓</b>
            </button>
            <button class="block furniture-card" data-tab="furniture" data-category="chairs" data-block="chair" data-w="550" data-h="550">
              <span class="furniture-thumb svg-thumb single-symbol"><img src="./assets/floor-symbols/LoungeChair.svg" alt="" /></span>
              <strong>Кресло</strong>
              <small>550 × 550</small>
              <b>✓</b>
            </button>
            <button class="block furniture-card" data-tab="furniture" data-category="storage" data-block="cabinet" data-w="1200" data-h="550">
              <span class="furniture-thumb svg-thumb single-symbol"><img src="./assets/floor-symbols/Cabinet.svg" alt="" /></span>
              <strong>Шкаф</strong>
              <small>1200 × 550</small>
              <b>✓</b>
            </button>
            <button class="block furniture-card" data-tab="furniture" data-category="cabinets" data-block="tv" data-w="1600" data-h="420">
              <span class="furniture-thumb svg-thumb single-symbol"><img src="./assets/floor-symbols/TV.svg" alt="" /></span>
              <strong>ТВ тумба</strong>
              <small>1600 × 420</small>
              <b>✓</b>
            </button>
            <button class="block furniture-card" data-tab="doors" data-category="swing" data-block="door" data-w="900" data-h="900">
              <span class="furniture-thumb svg-thumb single-symbol"><img src="./assets/floor-symbols/SingleDoor-NoWall.svg" alt="" /></span>
              <strong>Дверь</strong>
              <small>900 × 900</small>
              <b>✓</b>
            </button>
            <button class="block furniture-card" data-tab="windows" data-category="windows" data-block="window" data-w="1800" data-h="180">
              <span class="furniture-thumb svg-thumb single-symbol"><img src="./assets/floor-symbols/SlidingWindow.svg" alt="" /></span>
              <strong>Окно</strong>
              <small>1800 × 180</small>
              <b>✓</b>
            </button>
            <button class="block furniture-card" data-tab="kitchen" data-category="kitchen" data-block="table" data-w="600" data-h="600">
              <span class="furniture-thumb svg-thumb single-symbol"><img src="./assets/floor-symbols/Stove.svg" alt="" /></span>
              <strong>Модуль кухни</strong>
              <small>600 × 600</small>
              <b>✓</b>
            </button>
            <button class="block furniture-card" data-tab="kitchen" data-category="kitchen" data-block="sink" data-w="600" data-h="500">
              <span class="furniture-thumb svg-thumb single-symbol"><img src="./assets/floor-symbols/Sink.svg" alt="" /></span>
              <strong>Мойка</strong>
              <small>600 × 500</small>
              <b>✓</b>
            </button>
            <button class="block furniture-card" data-tab="bath" data-category="bath" data-block="toilet" data-w="700" data-h="450">
              <span class="furniture-thumb svg-thumb single-symbol"><img src="./assets/floor-symbols/Toilet.svg" alt="" /></span>
              <strong>Унитаз</strong>
              <small>700 × 450</small>
              <b>✓</b>
            </button>
            <button class="block furniture-card" data-tab="bath" data-category="bath" data-block="tub" data-w="1700" data-h="750">
              <span class="furniture-thumb svg-thumb single-symbol"><img src="./assets/floor-symbols/Tub.svg" alt="" /></span>
              <strong>Ванна</strong>
              <small>1700 × 750</small>
              <b>✓</b>
            </button>
            <button class="block furniture-card" data-tab="decor" data-category="decor" data-block="lamp" data-w="450" data-h="450">
              <span class="furniture-thumb svg-thumb single-symbol"><img src="./assets/floor-symbols/Lamp.svg" alt="" /></span>
              <strong>Светильник</strong>
              <small>450 × 450</small>
              <b>✓</b>
            </button>
          </div>
        </div>
      </section>

      <section class="bottom-sheet" id="layersSheet" hidden aria-label="Слои">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <div>
            <span class="panel-kicker">Слои</span>
            <strong>Управление чертежом</strong>
          </div>
          <button class="icon-button" id="closeLayersButton" aria-label="Закрыть слои">×</button>
        </div>
        <div class="layer-list" id="layerList"></div>
      </section>

      <section class="bottom-sheet" id="exportSheet" hidden aria-label="Экспорт">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <div>
            <span class="panel-kicker">Экспорт</span>
            <strong>CAD / PDF / BIM</strong>
          </div>
          <button class="icon-button" id="closeExportButton" aria-label="Закрыть экспорт">×</button>
        </div>
        <div class="export-grid">
          <button class="export-card" data-export="pdf"><strong>PDF</strong><span>печать и клиент</span></button>
          <button class="export-card ready" data-export="dxf"><strong>DXF</strong><span>AutoCAD, Archicad, Revit</span></button>
          <button class="export-card" data-export="dwg"><strong>DWG</strong><span>через ODA/сервер</span></button>
          <button class="export-card" data-export="ifc"><strong>IFC</strong><span>BIM позже</span></button>
        </div>
      </section>
    </main>

    <script src="./app.js?v=40"></script>
  </body>
</html>
