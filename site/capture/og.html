<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Zamer CAD — OG</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="../public/styles.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    .og { position: relative; width: 1200px; height: 630px; padding: 64px 0 0 72px; isolation: isolate; }
    .og::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background:
        linear-gradient(var(--grid-major) 1px, transparent 1px) 0 0 / 120px 120px,
        linear-gradient(90deg, var(--grid-major) 1px, transparent 1px) 0 0 / 120px 120px,
        linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
        linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px;
    }
    .og .brand { font-size: 30px; gap: 14px; }
    .og .brand-mark { width: 52px; height: 52px; border-radius: 13px; }
    .og h1 { font-size: 70px; max-width: 11ch; margin-top: 32px; }
    .og-sub { margin-top: 24px; font-size: 26px; line-height: 1.4; color: var(--text); max-width: 520px; }
    .og-badge { display: inline-flex; align-items: center; gap: 12px; margin-top: 26px; padding: 12px 20px; border-radius: 14px; background: var(--brand-ink); color: #fff; font-weight: 700; font-size: 24px; }
    .og-visual { position: absolute; right: 56px; top: 40px; width: 470px; height: 600px; }
    .og-visual .sheet { width: 300px; top: 70px; left: 0; }
    .og-visual .device { position: absolute; right: 0; top: 0; width: 280px; }
  </style>
</head>
<body>
  <svg class="sprite" width="0" height="0" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 64 64">
      <clipPath id="logo-clip"><rect width="64" height="64" rx="15"/></clipPath>
      <g clip-path="url(#logo-clip)">
        <rect width="64" height="64" fill="#1f75ff"/>
        <path d="M10.75 0v64M21.5 0v64M32.25 0v64M43 0v64M53.75 0v64M0 10.75h64M0 21.5h64M0 32.25h64M0 43h64M0 53.75h64" stroke="#5a9dfb" stroke-width="1"/>
      </g>
      <path fill="#fff" d="M19.25 17.25H24V42h21.5v4.75H19.25z"/>
      <path fill="#fff" d="M24 24.6h3.3v1.5H24zM24 32h3.3v1.5H24zM26 38.7h1.5V42H26zM32.2 38.7h1.5V42h-1.5zM39 38.7h1.5V42H39z"/>
    </symbol>
  </svg>
  <div class="og">
    <span class="brand"><svg class="brand-mark"><use href="#logo"/></svg><span>Zamer CAD</span></span>
    <h1>Замер без бумаги и&nbsp;перерисовки</h1>
    <p class="og-sub">Чертёж замера прямо на&nbsp;объекте. PDF&nbsp;клиенту, DWG&nbsp;— проектировщику.</p>
    <span class="og-badge">14 дней бесплатно</span>
    <div class="og-visual">
      <img class="sheet" src="../public/img/pdf-sheet.webp" alt="">
      <div class="device"><img src="../public/img/screen-plan.webp" alt=""></div>
    </div>
  </div>
</body>
</html>
